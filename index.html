<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小说阅读 · 仿真翻页</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{
    --reader-font: 17px;
    --reader-bg: #f7f4ee;
    --reader-text: #2f2c28;
    --page-back: #efeae2;
    --reader-shadow: rgba(0,0,0,.12);
  }
  html.dark{
    --reader-bg: #1a1a1c;
    --reader-text: #c8c3bb;
    --page-back: #2a2a2e;
    --reader-shadow: rgba(0,0,0,.5);
  }
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    background:#f5f5f7;color:#1f1f1f;overflow:hidden;
  }

  .page{position:fixed;inset:0;display:none;flex-direction:column;background:#fff;z-index:1}
  .page.active{display:flex;animation:pageIn .22s ease}
  @keyframes pageIn{from{opacity:.3;transform:translateX(14px)}to{opacity:1;transform:none}}

  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px 30px}

  .bar{
    display:flex;align-items:center;gap:8px;flex:none;
    padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
    background:#fff;border-bottom:1px solid #f0f0f0;
  }
  .icon-btn{
    width:36px;height:36px;flex:none;border:0;background:transparent;font-size:24px;line-height:1;
    color:#333;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .icon-btn:active{background:#f2f2f5}
  .bar-title{flex:1;text-align:center;font-size:16px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-sub{font-size:12px;color:#999;min-width:36px;text-align:right;padding-right:6px}

  .cc-cover img,.book-cover img,.intro-cover img{
    width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit;
  }

  #page-home{background:#f5f5f7}
  .home-header{
    flex:none;display:flex;align-items:flex-end;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 20px) 20px 10px;background:#f5f5f7;
  }
  .home-header h1{font-size:26px;letter-spacing:1px}
  .home-header .icon-btn{font-size:19px;color:#666}

  #page-home .scroll{padding:0 20px 30px}

  .continue-card{
    display:flex;align-items:center;gap:14px;margin-top:10px;padding:16px;
    border-radius:18px;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,#2b2b3a,#454260);
    box-shadow:0 12px 26px -14px rgba(0,0,0,.6);
  }
  .cc-cover{
    width:52px;height:70px;flex:none;border-radius:8px;overflow:hidden;
    background:linear-gradient(135deg,#e8543f,#f0a04b);
  }
  .cc-info{flex:1;min-width:0}
  .cc-info h3{font-size:16px;margin-bottom:6px}
  .cc-info p{font-size:12px;color:rgba(255,255,255,.65)}
  .progress{height:4px;border-radius:2px;background:rgba(255,255,255,.22);margin-top:10px;overflow:hidden}
  .progress span{display:block;height:100%;background:#fff;border-radius:2px}
  .cc-btn{
    flex:none;font-size:12px;padding:7px 12px;border-radius:14px;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);
  }

  .sec-title{font-size:15px;color:#333;margin:26px 0 4px;font-weight:600}

  .book-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 14px;margin-top:14px}
  .book{cursor:pointer}
  .book:active{opacity:.75}
  .book-cover{
    aspect-ratio:3/4;border-radius:10px;overflow:hidden;
    box-shadow:0 8px 16px -10px rgba(0,0,0,.7);
    background:#ddd;
  }
  .book-name{font-size:13px;color:#333;margin-top:8px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}

  .intro-head{display:flex;gap:16px;padding:22px 0 10px}
  .intro-cover{
    width:96px;height:132px;flex:none;border-radius:10px;overflow:hidden;
    background:linear-gradient(135deg,#e8543f,#f0a04b);
    box-shadow:0 14px 24px -14px rgba(0,0,0,.7);
  }
  .intro-meta{flex:1;min-width:0;padding-top:4px}
  .intro-meta h2{font-size:20px;margin-bottom:8px}
  .author{font-size:13px;color:#888;margin-bottom:12px}
  .tags span{
    display:inline-block;font-size:11px;color:#d94f3d;background:#fdecea;
    padding:3px 9px;border-radius:10px;margin-right:6px;
  }
  .stat{font-size:12px;color:#999;margin-top:12px}
  .stat b{color:#d94f3d}

  .intro-body{margin-top:18px;padding-top:18px;border-top:1px solid #f2f2f2}
  .intro-body h3{font-size:15px;margin-bottom:12px;font-weight:600}
  .intro-body p{font-size:14px;line-height:1.9;color:#555;text-align:justify}

  .bottom-bar{
    flex:none;display:flex;gap:12px;
    padding:12px 20px calc(env(safe-area-inset-bottom) + 12px);
    background:#fff;border-top:1px solid #f0f0f0;
  }
  .btn{height:46px;border:0;border-radius:23px;font-size:15px;font-weight:600;cursor:pointer}
  .btn:active{opacity:.85}
  .btn.primary{flex:1;background:#d94f3d;color:#fff}
  .btn.ghost{flex:0 0 96px;background:#f2f2f5;color:#333}

  .toc-list{list-style:none;padding-top:4px}
  .toc-item{
    display:flex;align-items:center;gap:12px;padding:16px 2px;
    border-bottom:1px solid #f4f4f4;font-size:15px;color:#333;cursor:pointer;
  }
  .toc-item:active{background:#fafafa}
  .toc-item.active{color:#d94f3d;font-weight:600}
  .toc-index{width:24px;flex:none;font-size:12px;color:#c2c2c2;font-family:ui-monospace,monospace}
  .toc-item.active .toc-index{color:#d94f3d}
  .toc-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .toc-empty{text-align:center;color:#aaa;font-size:14px;padding:60px 20px;line-height:2}

  /* ============ 内容页 ============ */
  #page-content{
    background: var(--reader-bg);
    transition: background .3s ease;
  }

  #page-content .bar{
    background: var(--reader-bg);
    border-bottom: 1px solid var(--reader-shadow);
    transition: background .3s ease, border-color .3s ease;
  }
  #page-content .icon-btn{color: var(--reader-text); transition: color .3s;}
  #page-content .bar-title{color: var(--reader-text); transition: color .3s;}
  #page-content .font-btn{ color: var(--reader-text); }

  .bar-actions{display:flex;align-items:center;gap:2px;flex:none}

  .theme-btn{
    font-size: 19px;
    width: 36px;height: 36px;
    display: flex;align-items: center;justify-content: center;
    border-radius: 50%;border: 0;background: transparent;
    color: var(--reader-text);
    cursor: pointer;
    transition: background .2s, color .3s, transform .3s;
  }
  .theme-btn:active{background: rgba(0,0,0,.06); transform: scale(.92);}

  /* 阅读区 - 仿真翻页容器 */
  .reader-viewport{
    flex: 1;
    position: relative;
    overflow: hidden;
    perspective: 2200px;
    perspective-origin: 50% 50%;
    background: var(--reader-bg);
    touch-action: pan-y;
    transition: background .3s;
  }

  /* 书脊阴影 */
  .reader-viewport::before{
    content: '';
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 26px;
    background: linear-gradient(to right, var(--reader-shadow), transparent);
    pointer-events: none;
    z-index: 20;
    opacity: .8;
  }

  .flip-pages{
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
  }

  .flip-page{
    position: absolute;
    inset: 0;
    transform-origin: left center;
    transform-style: preserve-3d;
    transform: rotateY(0deg);
    transition: transform .75s cubic-bezier(.42,.02,.28,1);
    will-change: transform;
    backface-visibility: hidden;
  }
  .flip-page.flipped{
    transform: rotateY(-180deg);
  }

  .page-face{
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    overflow: hidden;
    background: var(--reader-bg);
    transition: background .3s;
  }

  .page-front{
    display: flex;
    flex-direction: column;
    padding: 24px 24px 24px;
    box-shadow: inset -12px 0 18px -14px var(--reader-shadow);
  }
  .page-front::after{
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 22px;
    background: linear-gradient(to left, var(--reader-shadow), transparent 85%);
    opacity: .35;
    pointer-events: none;
  }

  .page-back{
    transform: rotateY(180deg);
    background: var(--page-back);
    box-shadow: inset 12px 0 18px -14px var(--reader-shadow);
  }

  .chapter-h{
    font-family:"Songti SC","STSong",Georgia,serif;
    font-size:calc(var(--reader-font) + 3px);
    font-weight:700;
    letter-spacing:1px;
    margin: 0 0 18px;
    color: var(--reader-text);
    transition: color .3s, font-size .15s;
    flex: none;
  }

  .content{
    flex: 1;
    overflow: hidden;
  }

  .content p{
    font-family:"Songti SC","STSong",Georgia,serif;
    font-size: var(--reader-font);
    line-height: 2;
    text-indent: 2em;
    margin: 0 0 14px;
    color: var(--reader-text);
    text-align: justify;
    transition: color .3s, font-size .15s;
    word-break: break-word;
  }

  .content p.plain{
    text-indent:0;
    color: #999;
    font-family:inherit;
    font-size:14px;
  }

  .nav-arrow{
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;height: 46px;
    border: 0;
    border-radius: 50%;
    background: rgba(0,0,0,.10);
    color: var(--reader-text);
    font-size: 26px;
    display: flex;align-items: center;justify-content: center;
    cursor: pointer;
    z-index: 30;
    backdrop-filter: blur(6px);
    transition: opacity .25s, background .2s, color .3s;
    opacity: .55;
  }
  .nav-arrow:active{background: rgba(0,0,0,.22);}
  .nav-arrow.prev{left: 10px;}
  .nav-arrow.next{right: 10px;}
  /* 注意：箭头"隐藏"当且仅当对应方向完全没有内容（第一章第一页/最后一章最后一页） */
  .nav-arrow.hidden{opacity: 0;pointer-events: none;}

  .reader-foot{
    flex:none;
    display: flex;
    flex-direction: column;
    padding: 8px 14px calc(env(safe-area-inset-bottom) + 8px);
    background: var(--reader-bg);
    border-top: 1px solid var(--reader-shadow);
    transition: background .3s, border-color .3s;
  }

  .progress-line{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 4px 10px;
  }
  .progress-bar-bg{
    flex: 1;
    height: 6px;
    background: rgba(128,128,128,.25);
    border-radius: 3px;
    overflow: hidden;
    cursor: pointer;
    transition: background .3s;
  }
  .progress-fill{
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#d94f3d,#e8724a);
    border-radius: 3px;
    transition: width .25s ease;
  }
  .progress-text{
    font-size: 12px;
    color: var(--reader-text);
    font-family: ui-monospace,monospace;
    min-width: 62px;
    text-align: right;
    opacity: .75;
    transition: color .3s;
    letter-spacing: .5px;
  }

  .foot-buttons{
    display: flex;
    gap: 8px;
  }
  .foot-buttons button{
    flex:1;
    height:42px;
    border:0;
    border-radius:12px;
    background:transparent;
    font-size:14px;
    color: var(--reader-text);
    cursor:pointer;
    transition: background .2s, color .3s;
  }
  .foot-buttons button:active{
    background: rgba(128,128,128,.12);
  }

  .font-panel{
    position:absolute;
    top:calc(env(safe-area-inset-top) + 62px);
    right:16px;
    z-index:40;
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;
    border-radius:26px;
    background: var(--reader-bg);
    box-shadow:0 12px 30px -10px var(--reader-shadow);
    border:1px solid var(--reader-shadow);
    animation:panelIn .18s ease;
    transition: background .3s, border-color .3s;
  }
  @keyframes panelIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .font-panel[hidden]{display:none}

  .font-panel button{
    width:38px;height:38px;border:0;border-radius:50%;
    background: rgba(128,128,128,.15);
    color: var(--reader-text);
    font-size:14px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition: background .2s, color .3s;
  }
  .font-panel button:active{background: rgba(128,128,128,.3);}
  .font-panel button:disabled{opacity:.35;cursor:not-allowed;}

  .font-size-val{
    min-width:44px;text-align:center;
    font-size:14px;
    color: var(--reader-text);
    font-family:ui-monospace,monospace;
    transition: color .3s;
  }

  #toast{
    position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(10px);
    background:rgba(0,0,0,.78);color:#fff;font-size:13px;padding:9px 18px;border-radius:20px;
    opacity:0;pointer-events:none;transition:.25s;z-index:99;white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ================= 1. 主页面 ================= -->
<section class="page active" id="page-home">
  <header class="home-header">
    <h1>书架</h1>
    <button class="icon-btn">&#9788;</button>
  </header>

  <div class="scroll">
    <div class="continue-card" onclick="go('page-intro')">
      <div class="cc-cover">
        <img src="武神录：命咒之凰.png" alt="主封面" onerror="this.style.display='none'">
      </div>
      <div class="cc-info">
        <h3 data-book-title>武神录：命咒之凰</h3>
        <p id="ccProgress">上次读到 · 第一章</p>
        <div class="progress"><span style="width:35%"></span></div>
      </div>
      <div class="cc-btn">继续</div>
    </div>

    <h2 class="sec-title">全部书籍</h2>
    <div class="book-grid">
      <div class="book" onclick="go('page-intro')">
        <div class="book-cover">
          <img src="武神录：命咒之凰.png" alt="武神录：命咒之凰" onerror="this.style.display='none'">
        </div>
        <div class="book-name" data-book-title>武神录：命咒之凰</div>
      </div>
    </div>
  </div>
</section>

<!-- ================= 2. 简介页 ================= -->
<section class="page" id="page-intro">
  <header class="bar">
    <button class="icon-btn" onclick="go('page-home')">&#8249;</button>
    <span class="bar-title">书籍详情</span>
    <span class="bar-sub"></span>
  </header>

  <div class="scroll">
    <div class="intro-head">
      <div class="intro-cover">
        <img src="武神录：命咒之凰.png" alt="封面" onerror="this.style.display='none'">
      </div>
      <div class="intro-meta">
        <h2 data-book-title>武神录：命咒之凰</h2>
        <p class="author" data-book-author>作者：无声</p>
        <p class="tags" id="introTags"></p>
        <p class="stat">共 <b id="introChapters">3</b> 章 · 连载中</p>
      </div>
    </div>

    <div class="intro-body">
      <h3>简介</h3>
      <p id="introText"></p>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="btn ghost" onclick="go('page-toc')">目录</button>
    <button class="btn primary" onclick="openChapter(0)">开始阅读</button>
  </div>
</section>

<!-- ================= 3. 目录页 ================= -->
<section class="page" id="page-toc">
  <header class="bar">
    <button class="icon-btn" onclick="go('page-intro')">&#8249;</button>
    <span class="bar-title">目录</span>
    <span class="bar-sub" id="tocCount"></span>
  </header>

  <div class="scroll">
    <ul class="toc-list" id="tocList"></ul>
  </div>
</section>

<!-- ================= 4. 内容页 ================= -->
<section class="page" id="page-content">

  <header class="bar">
    <button class="icon-btn" onclick="go('page-toc')">&#8249;</button>
    <span class="bar-title" id="chapterTitle">章节名</span>
    <div class="bar-actions">
      <button class="icon-btn theme-btn" id="themeBtn" onclick="toggleTheme()" title="深色/明亮">🌙</button>
      <button class="icon-btn font-btn" onclick="toggleFontPanel(event)" title="调整字号">Aa</button>
    </div>
  </header>

  <div class="font-panel" id="fontPanel" hidden onclick="event.stopPropagation()">
    <button id="fontMinus" onclick="changeFontSize(-1)">A－</button>
    <span class="font-size-val" id="fontSizeLabel">17</span>
    <button id="fontPlus" onclick="changeFontSize(1)">A＋</button>
  </div>

  <div class="reader-viewport" id="readerViewport">
    <div class="flip-pages" id="flipPages"></div>
    <button class="nav-arrow prev" id="prevArrow" onclick="prevPage()" aria-label="上一页">‹</button>
    <button class="nav-arrow next" id="nextArrow" onclick="nextPage()" aria-label="下一页">›</button>
  </div>

  <footer class="reader-foot">
    <div class="progress-line">
      <div class="progress-bar-bg" id="progressBarBg" onclick="seekProgress(event)">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="progress-text" id="progressText">0.0%</span>
    </div>
    <div class="foot-buttons">
      <button onclick="prevChapter()">上一章</button>
      <button onclick="go('page-toc')">目录</button>
      <button onclick="nextChapter()">下一章</button>
    </div>
  </footer>
</section>

<script src="toc.js"></script>

<script>
/* ================================================================
   ① 小说信息
   ================================================================ */
const bookInfo = {
  title:  "武神录：命咒之凰",
  author: "无声",
  tags:   ["玄幻", "连载中"],
  intro:  "被命运诅咒之子，被命运选中之人，是明是暗皆有他一个定夺"
};

const TOC = window.NOVEL_TOC || [];
const $ = s => document.querySelector(s);

let currentIndex = 0;
let pages = [];              // 当前章节分页后的段落数组
let currentPage = 0;
const chapterCache = {};       // 章节文本缓存
const chapterPageCache = {};   // 各章页数缓存（用于全文进度估算）

/* ---------- 页面切换 ---------- */
function go(pageId){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  closeFontPanel();
}

/* ---------- 渲染目录 ---------- */
function renderToc(){
  if(!TOC.length){
    $('#tocList').innerHTML =
      '<li class="toc-empty">还没有章节<br>请在 <b>toc.js</b> 里添加章节</li>';
    $('#tocCount').textContent = '';
    $('#introChapters').textContent = '0';
    return;
  }
  $('#tocList').innerHTML = TOC.map((c, i) => `
    <li class="toc-item" data-index="${i}" onclick="openChapter(${i})">
      <span class="toc-index">${String(i + 1).padStart(2, '0')}</span>
      <span class="toc-name">${c.title}</span>
    </li>
  `).join('');
  $('#tocCount').textContent = '共 ' + TOC.length + ' 章';
  $('#introChapters').textContent = TOC.length;
}

/* ---------- 加载章节文本 ---------- */
function fetchChapter(index){
  if(chapterCache[index] !== undefined) return Promise.resolve(chapterCache[index]);
  const meta = TOC[index];
  if(!meta || !meta.file) return Promise.reject(new Error('章节配置缺失'));
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = meta.file;
    s.onload = () => {
      const text = window.__CHAPTER_TEXT__;
      window.__CHAPTER_TEXT__ = undefined;
      if(typeof text !== 'string'){
        reject(new Error('文件格式不对：' + meta.file));
        return;
      }
      chapterCache[index] = text;
      resolve(text);
    };
    s.onerror = () => reject(new Error('找不到文件：' + meta.file));
    document.head.appendChild(s);
  });
}

/* ================================================================
   ② 分页
   ================================================================ */
function computePages(text, viewportEl){
  const vpH = viewportEl.clientHeight;
  const vpW = viewportEl.clientWidth;
  const paddingTop = 24, paddingBottom = 24, paddingLR = 24;
  const contentWidth = vpW - paddingLR * 2;
  const titleReserved = 60;
  const GAP = 14;

  const measure = document.createElement('div');
  measure.style.cssText = `
    position:absolute; visibility:hidden; pointer-events:none; left:-9999px; top:0;
    width:${contentWidth}px;
    font-family:"Songti SC","STSong",Georgia,serif;
    font-size:var(--reader-font);
    line-height:2;
  `;
  document.body.appendChild(measure);

  function measureP(txt){
    const p = document.createElement('p');
    p.style.cssText = `margin:0;padding:0;text-indent:2em;text-align:justify;
      font-family:inherit;font-size:inherit;line-height:inherit;word-break:break-word;`;
    p.textContent = txt;
    measure.appendChild(p);
    const h = p.offsetHeight;
    measure.removeChild(p);
    return h;
  }

  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length);
  const paragraphs = lines.length ? lines : ['（本章暂无内容）'];
  const heights = paragraphs.map(measureP);
  document.body.removeChild(measure);

  const pageContents = [];
  let cur = [], curH = 0;
  for(let i = 0; i < paragraphs.length; i++){
    const h = heights[i];
    const addH = (cur.length ? GAP : 0) + h;
    const avail = (pageContents.length === 0)
      ? (vpH - paddingTop - paddingBottom - titleReserved)
      : (vpH - paddingTop - paddingBottom);
    if(cur.length && curH + addH > avail){
      pageContents.push(cur);
      cur = [paragraphs[i]];
      curH = h;
    } else {
      cur.push(paragraphs[i]);
      curH += addH;
    }
  }
  if(cur.length) pageContents.push(cur);
  if(!pageContents.length) pageContents.push(['（本章暂无内容）']);

  return pageContents;
}

function renderPages(pageContents){
  const wrap = $('#flipPages');
  wrap.innerHTML = '';
  const total = pageContents.length;

  pageContents.forEach((paras, idx) => {
    const pageEl = document.createElement('div');
    pageEl.className = 'flip-page';
    pageEl.style.zIndex = String(total - idx);

    const front = document.createElement('div');
    front.className = 'page-face page-front';
    if(idx === 0){
      const h2 = document.createElement('h2');
      h2.className = 'chapter-h';
      h2.textContent = TOC[currentIndex].title;
      front.appendChild(h2);
    }
    const contentEl = document.createElement('div');
    contentEl.className = 'content';
    contentEl.innerHTML = paras.map(p => `<p>${p}</p>`).join('');
    front.appendChild(contentEl);
    pageEl.appendChild(front);

    const back = document.createElement('div');
    back.className = 'page-face page-back';
    pageEl.appendChild(back);

    wrap.appendChild(pageEl);
  });

  pages = pageContents;
  chapterPageCache[currentIndex] = total;
}

/* ---------- 箭头可见性 ----------
   只在"全书最开头"隐藏左箭头；"全书最末尾"隐藏右箭头。
   中间章节的边界仍显示箭头，因为点击后会跨章节。 */
function updateArrows(){
  const atVeryStart = (currentIndex === 0 && currentPage <= 0);
  const atVeryEnd   = (currentIndex === TOC.length - 1 && currentPage >= pages.length - 1);
  $('#prevArrow').classList.toggle('hidden', atVeryStart);
  $('#nextArrow').classList.toggle('hidden', atVeryEnd);
}

/* ---------- 全文进度百分比 ---------- */
function updateProgress(){
  const totalChapters = TOC.length;
  if(totalChapters === 0){
    $('#progressFill').style.width = '0%';
    $('#progressText').textContent = '0.0%';
    return;
  }

  const knownKeys = Object.keys(chapterPageCache).map(Number);
  const knownVals = knownKeys.map(k => chapterPageCache[k]);
  const avgPages = knownVals.length
    ? knownVals.reduce((a,b) => a+b, 0) / knownVals.length
    : 1;

  const chapterPages = [];
  let totalPages = 0;
  for(let i = 0; i < totalChapters; i++){
    const p = (chapterPageCache[i] !== undefined) ? chapterPageCache[i] : avgPages;
    chapterPages[i] = p;
    totalPages += p;
  }

  let readPages = 0;
  for(let i = 0; i < currentIndex; i++) readPages += chapterPages[i];
  const curTotal = pages.length || 1;
  readPages += ((currentPage + 1) / curTotal) * chapterPages[currentIndex];

  let progress = totalPages > 0 ? (readPages / totalPages) * 100 : 0;
  progress = Math.max(0.1, Math.min(100, progress));

  $('#progressFill').style.width = progress + '%';
  $('#progressText').textContent = progress.toFixed(1) + '%';
}

/* ---------- 跳转到指定页 ---------- */
function goToPage(index, instant){
  if(index < 0) index = 0;
  if(index > pages.length - 1) index = pages.length - 1;
  if(index === currentPage && !instant) return;

  const allPages = document.querySelectorAll('.flip-page');
  const oldPage = currentPage;
  currentPage = index;

  if(instant){
    allPages.forEach((el, i) => {
      el.style.transition = 'none';
      if(i < index) el.classList.add('flipped');
      else el.classList.remove('flipped');
    });
    void document.body.offsetWidth;
    allPages.forEach(el => el.style.transition = '');
  } else {
    if(index > oldPage){
      for(let i = oldPage; i < index; i++){
        setTimeout(() => allPages[i].classList.add('flipped'), (i - oldPage) * 60);
      }
    } else {
      for(let i = oldPage - 1; i >= index; i--){
        setTimeout(() => allPages[i].classList.remove('flipped'), (oldPage - 1 - i) * 60);
      }
    }
  }

  updateArrows();
  updateProgress();
}

/* ================================================================
   ③ 翻页（含跨章联动）
   ================================================================ */
const FLIP_MS = 750;   // 与 CSS transition 时长一致
const CHAPTER_GAP = 520; // 跨章时等待翻页完成再加载下一章

/* 让当前最后一页翻出去，然后加载下一章 */
function flipToNextChapter(){
  const allPages = document.querySelectorAll('.flip-page');
  const last = allPages[allPages.length - 1];
  if(last && !last.classList.contains('flipped')){
    last.classList.add('flipped');
    setTimeout(() => openChapter(currentIndex + 1), CHAPTER_GAP);
  } else {
    openChapter(currentIndex + 1);
  }
}

/* 让当前第一页转回来，然后加载上一章最后一页 */
function flipToPrevChapter(){
  const allPages = document.querySelectorAll('.flip-page');
  const first = allPages[0];
  // 若第一页还没被翻过，先让它呈现"翻过去"再转回来会更自然
  // 但当前就是第一页，它本来就是未翻转状态
  // 直接让下一章加载（上一章的最后一页会是翻转状态）
  openChapter(currentIndex - 1, { jumpToLast: true });
}

function prevPage(){
  if(currentPage > 0){
    goToPage(currentPage - 1);
  } else if(currentIndex > 0){
    flipToPrevChapter();
  } else {
    toast('已经是第一页了');
  }
}

function nextPage(){
  if(currentPage < pages.length - 1){
    goToPage(currentPage + 1);
  } else if(currentIndex < TOC.length - 1){
    flipToNextChapter();
  } else {
    toast('已经是最后一页了');
  }
}

/* ---------- 上一章 / 下一章（底部按钮，直接切） ---------- */
function prevChapter(){
  if(currentIndex > 0) openChapter(currentIndex - 1);
  else toast('已经是第一章了');
}
function nextChapter(){
  if(currentIndex < TOC.length - 1) openChapter(currentIndex + 1);
  else toast('已经是最后一章了');
}

/* ---------- 点击进度条 ---------- */
function seekProgress(e){
  if(!pages.length) return;
  const rect = $('#progressBarBg').getBoundingClientRect();
  const x = e.clientX - rect.left;
  const percent = Math.max(0, Math.min(1, x / rect.width));
  const target = Math.round(percent * (pages.length - 1));
  if(target !== currentPage) goToPage(target);
}

/* ================================================================
   ④ 打开某一章
   ================================================================ */
async function openChapter(i, opts){
  opts = opts || {};
  if(i < 0 || i >= TOC.length) return;
  currentIndex = i;
  currentPage = 0;

  $('#chapterTitle').textContent = TOC[i].title;

  go('page-content');
  $('#flipPages').innerHTML = '<div class="flip-page" style="z-index:1"><div class="page-face page-front"><div class="content"><p class="plain">加载中…</p></div></div><div class="page-face page-back"></div></div>';
  pages = [];

  try {
    const text = await fetchChapter(i);
    if(currentIndex !== i) return;

    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    const pageContents = computePages(text, $('#readerViewport'));
    renderPages(pageContents);

    if(opts.jumpToLast){
      // 打开后直接跳到最后一页（从上一章向前翻时使用）
      goToPage(pages.length - 1, true);
    } else {
      currentPage = 0;
      goToPage(0, true);
    }
    updateArrows();
    updateProgress();
  } catch(err){
    if(currentIndex !== i) return;
    $('#flipPages').innerHTML = `<div class="flip-page" style="z-index:1"><div class="page-face page-front"><div class="content"><p class="plain" style="color:#c33">${err.message}</p></div></div><div class="page-face page-back"></div></div>`;
    pages = [];
    updateArrows();
  }
}

/* ================================================================
   ⑤ 字号调整
   ================================================================ */
const FONT_MIN = 14, FONT_MAX = 26, FONT_KEY = 'readerFontSize';
let fontSize = parseInt(localStorage.getItem(FONT_KEY) || '17', 10);
if(isNaN(fontSize)) fontSize = 17;
fontSize = Math.min(FONT_MAX, Math.max(FONT_MIN, fontSize));

function applyFontSize(){
  document.documentElement.style.setProperty('--reader-font', fontSize + 'px');
  $('#fontSizeLabel').textContent = fontSize;
  $('#fontMinus').disabled = (fontSize <= FONT_MIN);
  $('#fontPlus').disabled  = (fontSize >= FONT_MAX);
  try { localStorage.setItem(FONT_KEY, fontSize); } catch(e){}
}

function changeFontSize(delta){
  const next = fontSize + delta;
  if(next < FONT_MIN){ toast('已经是最小字号'); return; }
  if(next > FONT_MAX){ toast('已经是最大字号'); return; }
  fontSize = next;
  applyFontSize();

  if(TOC.length && chapterCache[currentIndex]){
    const oldTotal = pages.length;
    const ratio = oldTotal > 0 ? (currentPage + 1) / oldTotal : 0;
    requestAnimationFrame(() => {
      const pageContents = computePages(chapterCache[currentIndex], $('#readerViewport'));
      renderPages(pageContents);
      const newPage = Math.min(pages.length - 1, Math.max(0, Math.round(ratio * pages.length) - 1));
      goToPage(newPage, true);
      updateProgress();
    });
  }
}

function toggleFontPanel(e){
  if(e) e.stopPropagation();
  const panel = $('#fontPanel');
  panel.hidden = !panel.hidden;
}
function closeFontPanel(){ $('#fontPanel').hidden = true; }

document.addEventListener('click', e => {
  const panel = $('#fontPanel');
  if(panel && !panel.hidden && !panel.contains(e.target) && !e.target.closest('.font-btn')){
    panel.hidden = true;
  }
});

/* ================================================================
   ⑥ 深色 / 明亮
   ================================================================ */
const THEME_KEY = 'readerThemeDark';
let darkMode = localStorage.getItem(THEME_KEY) === 'true';

function applyTheme(){
  document.documentElement.classList.toggle('dark', darkMode);
  const btn = $('#themeBtn');
  if(btn) btn.textContent = darkMode ? '☀️' : '🌙';
  try { localStorage.setItem(THEME_KEY, darkMode); } catch(e){}
}

function toggleTheme(){
  darkMode = !darkMode;
  applyTheme();
  toast(darkMode ? '已切换深色模式' : '已切换明亮模式');
}

/* ---------- 轻提示 ---------- */
let toastTimer;
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1400);
}

/* ================================================================
   ⑦ 滑动手势
   ================================================================ */
function initSwipe(){
  const viewport = $('#readerViewport');
  let startX = 0, startY = 0, isSwiping = false, locked = false;

  viewport.addEventListener('touchstart', e => {
    const t = e.touches[0];
    startX = t.clientX;
    startY = t.clientY;
    isSwiping = false;
    locked = false;
  }, { passive: true });

  viewport.addEventListener('touchmove', e => {
    if(e.touches.length > 1 || locked) return;
    const t = e.touches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if(!isSwiping && (Math.abs(dx) > 8 || Math.abs(dy) > 8)){
      if(Math.abs(dx) > Math.abs(dy)){
        isSwiping = true;
        locked = true;
      } else {
        locked = true;
      }
    }
    if(isSwiping) e.preventDefault();
  }, { passive: false });

  viewport.addEventListener('touchend', e => {
    if(!isSwiping) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    if(dx > 50) prevPage();
    else if(dx < -50) nextPage();
    isSwiping = false;
    locked = false;
  }, { passive: true });

  document.addEventListener('keydown', e => {
    if($('#page-content').classList.contains('active')){
      if(e.key === 'ArrowLeft') prevPage();
      if(e.key === 'ArrowRight') nextPage();
    }
  });
}

/* ---------- 窗口尺寸变化重新分页 ---------- */
let resizeTimer;
window.addEventListener('resize', () => {
  if(!$('#page-content').classList.contains('active')) return;
  if(!chapterCache[currentIndex]) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const oldTotal = pages.length;
    const ratio = oldTotal > 0 ? (currentPage + 1) / oldTotal : 0;
    const pageContents = computePages(chapterCache[currentIndex], $('#readerViewport'));
    renderPages(pageContents);
    const newPage = Math.min(pages.length - 1, Math.max(0, Math.round(ratio * pages.length) - 1));
    goToPage(newPage, true);
    updateProgress();
  }, 220);
});

/* ---------- 初始化 ---------- */
function initBook(){
  document.querySelectorAll('[data-book-title]').forEach(el => el.textContent = bookInfo.title);
  document.querySelectorAll('[data-book-author]').forEach(el => el.textContent = '作者：' + bookInfo.author);
  $('#introText').textContent = bookInfo.intro;
  $('#introTags').innerHTML = bookInfo.tags.map(t => `<span>${t}</span>`).join('');
  renderToc();
  applyFontSize();
  applyTheme();
  initSwipe();
}

initBook();
